<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <title>Questionnaire complete</title>
</head>
<body>
<div style="background:#fff4d6;color:#5c4400;text-align:center;font:600 14px/1.4 system-ui,sans-serif;padding:6px 16px;border-bottom:1px solid #e8d49a">Test version of the Benefits Assessment Tool. Not the live tool.</div>
    <script>
        // Loaded invisibly by the GAP health questionnaire (access.rdspcanada.ca)
        // after a successful submission. This page is on the assessment tool's
        // domain, so it can record completion in the shared assessment data.
        // Any open assessment tab (e.g. Next Steps) picks up the change.
        (function () {
            try {
                var all = JSON.parse(localStorage.getItem('dbpAssessmentTest')) || {};
                all.gapQuestionnaire = true;
                localStorage.setItem('dbpAssessmentTest', JSON.stringify(all));
            } catch (e) { /* storage unavailable */ }
        })();
    </script>
</body>
</html>
